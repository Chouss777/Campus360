spring.application.name=campus360
server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/campus360}
spring.datasource.username=${DB_USER:campus360}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.error.include-message=never
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
campus360.upload-dir=${UPLOAD_DIR:./uploads}
campus360.demo-password=${DEMO_ACCOUNT_PASSWORD:}
